volumes:
  production_postgres_data: {}
  production_postgres_data_backups: {}
  production_traefik: {}
  production_django_media: {}
  


services:
  django:
    build:
      context: .
      dockerfile: ./compose/production/django/Dockerfile

    image: devresurge_production_django
    volumes:
      - production_django_media:/app/devresurge/media
    depends_on:
      - postgres
      - redis
    env_file:
      - ./.envs/.production/.django
      - ./.envs/.production/.postgres
    command: /start
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:5000/health/', headers={'Host': '127.0.0.1'}), timeout=5)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  analytics-prune:
    image: devresurge_production_django
    depends_on:
      - postgres
      - redis
      - django
    env_file:
      - ./.envs/.production/.django
      - ./.envs/.production/.postgres
    command: /prune
    restart: unless-stopped

  postgres:
    build:
      context: .
      dockerfile: ./compose/production/postgres/Dockerfile
    image: devresurge_production_postgres
    volumes:
      - production_postgres_data:/var/lib/postgresql/18/docker
      - production_postgres_data_backups:/backups
    env_file:
      - ./.envs/.production/.postgres

  traefik:
    build:
      context: .
      dockerfile: ./compose/production/traefik/Dockerfile
    image: devresurge_production_traefik
    depends_on:
      - django
    volumes:
      - production_traefik:/etc/traefik/acme
    ports:
      - '0.0.0.0:80:80'
      - '0.0.0.0:443:443'

  redis:
    image: docker.io/redis:7.2
    

  nginx:
    build:
      context: .
      dockerfile: ./compose/production/nginx/Dockerfile
    image: devresurge_production_nginx
    depends_on:
      - django
    volumes:
      - production_django_media:/usr/share/nginx/media:ro
