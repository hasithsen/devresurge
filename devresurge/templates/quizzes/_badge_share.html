{% load i18n %}
<nav class="dr-share-btns{% if prominent %} dr-share-btns--prominent{% endif %}"
     aria-label="{% translate 'Share badge' %}">
  {% if not hide_label %}
    <span class="dr-share-btns__label">{% translate "share" %}</span>
  {% endif %}
  <a class="dr-share-btn{% if prominent %} dr-share-btn--primary{% endif %}"
     href="{{ share.linkedin }}"
     target="_blank"
     rel="noopener noreferrer"
     data-share="linkedin">
    LinkedIn
  </a>
  <a class="dr-share-btn"
     href="{{ share.x }}"
     target="_blank"
     rel="noopener noreferrer"
     data-share="x">
    X
  </a>
  <a class="dr-share-btn"
     href="{{ share.whatsapp }}"
     target="_blank"
     rel="noopener noreferrer"
     data-share="whatsapp">
    WhatsApp
  </a>
  <a class="dr-share-btn"
     href="{{ share.reddit }}"
     target="_blank"
     rel="noopener noreferrer"
     data-share="reddit">
    Reddit
  </a>
  <a class="dr-share-btn"
     href="{{ share.email }}"
     data-share="email">
    {% translate "email" %}
  </a>
  {% if share.page_url %}
    <button type="button"
            class="dr-share-btn dr-copy"
            data-copy="{{ share.page_url }}"
            aria-label="{% translate 'Copy badge link' %}">
      <span data-copy-label>{% translate "copy link" %}</span>
    </button>
  {% endif %}
</nav>
