{% extends "base.html" %}

{% load i18n %}

{% block title %}403 — DevResurge{% endblock title %}

{% block content %}
  <section class="dr-page">
    <div class="dr-narrow dr-narrow--wide">
      <article class="dr-panel">
        <header class="dr-panel__header">
          <span class="dr-dots"><span></span><span></span><span></span></span>
          <span class="dr-panel__title">stderr — csrf</span>
        </header>
        <div class="dr-panel__body dr-error-page">
          <span class="dr-status">$ csrf --verify</span>
          <h1>{% trans "CSRF check failed." %}</h1>
          <p style="color: var(--text-muted); margin: 0;">
            {% trans "Your session may have expired. Reload the page and try again." %}
          </p>
          <div class="dr-btn-row">
            <a class="dr-btn dr-btn--primary" href="{% url 'home' %}">$ cd ~</a>
          </div>
        </div>
      </article>
    </div>
  </section>
{% endblock content %}
