{% extends "base.html" %}

{% block title %}rm link — DevResurge{% endblock title %}

{% block content %}
  <article class="dr-panel">
    <header class="dr-panel__header">
      <span class="dr-dots"><span></span><span></span><span></span></span>
      <span class="dr-panel__title">links/{{ object.pk }}/delete</span>
    </header>
    <div class="dr-panel__body dr-stack">
      <p class="dr-cli"><span class="dr-prompt"></span> <span class="cmd">rm -i "{{ object.display_label }}"</span></p>
      <p>Delete this link to <strong>{{ object.url }}</strong>?</p>
      <form method="post">
        {% csrf_token %}
        <div class="dr-btn-row">
          <button type="submit" class="dr-btn dr-btn--danger">y · delete</button>
          <a class="dr-btn dr-btn--ghost" href="{% url 'profiles:link_list' %}">n · cancel</a>
        </div>
      </form>
    </div>
  </article>
{% endblock content %}
