{% load allauth %}

<section class="dr-stack" style="margin-bottom: 1.5rem;">
  <article class="dr-panel">
    <header class="dr-panel__header">
      <span class="dr-dots"><span></span><span></span><span></span></span>
      <span class="dr-panel__title">{% slot title %}{% endslot %}</span>
    </header>
    <div class="dr-panel__body dr-stack">
      {% slot body %}{% endslot %}
      {% if slots.actions %}
        <div class="dr-btn-row" style="margin-top: 0.5rem;">
          {% for action in slots.actions %}{{ action }}{% endfor %}
        </div>
      {% endif %}
    </div>
  </article>
</section>
