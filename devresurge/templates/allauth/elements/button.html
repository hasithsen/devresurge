{% load allauth %}

{% comment %} djlint:off {% endcomment %}
{% if attrs.href %}<a href="{{ attrs.href }}"{% else %}<button{% endif %}
  {% if attrs.form %} form="{{ attrs.form }}"{% endif %}
  {% if attrs.id %} id="{{ attrs.id }}"{% endif %}
  {% if attrs.name %} name="{{ attrs.name }}"{% endif %}
  {% if attrs.type %} type="{{ attrs.type }}"{% endif %}
  class="dr-btn
{% if 'danger' in attrs.tags %}dr-btn--danger
{% elif 'secondary' in attrs.tags %}dr-btn--ghost
{% elif 'warning' in attrs.tags %}dr-btn--ghost
{% elif 'success' in attrs.tags %}dr-btn--primary
{% elif 'primary' in attrs.tags %}dr-btn--primary
{% else %}dr-btn--primary
{% endif %}"
>
{% slot %}{% endslot %}
{% if attrs.href %}</a>{% else %}</button>{% endif %}
