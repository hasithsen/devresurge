# Host-level reverse proxy for `docker-compose.production.multi.yml`.
#
# Prerequisites:
# - External Docker network `nginx_proxy_network` (see compose file).
# - TLS certificates on the host (paths below are examples).
# - Container names must match compose `container_name` values.

upstream devresurge_app {
    server devresurge_django:5000;
    keepalive 8;
}

upstream devresurge_media {
    server devresurge_nginx:80;
}

server {
    listen 443 ssl http2;
    server_name devresurge.com www.devresurge.com;

    ssl_certificate     /etc/letsencrypt/live/devresurge.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/devresurge.com/privkey.pem;

    client_max_body_size 4M;

    location /media/ {
        proxy_pass http://devresurge_media;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://devresurge_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    server_name devresurge.com www.devresurge.com;
    return 301 https://$host$request_uri;
}
